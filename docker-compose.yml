# The development stack deliberately still runs as root, unlike production
# (see docker-compose.prod.yml and docker/prod-entrypoint.sh). It bind-mounts
# the working copy read-write and writes node_modules, vendor and the Vite cache
# straight back into it, so the container has to match the developer's own host
# uid — and this stack is never exposed beyond localhost. Production is the one
# that faces a network, and that is where the app runs unprivileged.
services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8080:8000"
      - "${DEV_VITE_PORT:-5273}:5173"
    volumes:
      - .:/app
      - /app/vendor
      - ${WEALTH_TRACKER_DATA_DIR:-~/wealth-tracker-data}:/app/storage/app
      - ${WEALTH_TRACKER_BACKUP_DIR:-~/wealth-tracker-backups}:/app/backups
      # Scalable CLI login session + signing key — survives container recreation.
      - scalable-cli:/root/.config/scalable-cli
    env_file:
      - .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/app/database.sqlite
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: "30"
      # scripts/tunnel.sh sets APP_URL_OVERRIDE to the https tunnel origin so
      # Laravel/Inertia emit https URLs (an http APP_URL trips the browser's
      # mixed-content block during the bank-consent flow).
      APP_URL: ${APP_URL_OVERRIDE:-http://${DEV_HOST:-localhost}:8080}
      # The dev stack serves plain http, including to a phone on the LAN (see
      # the README). `.env.example` leaves this true, which is right for a
      # self-hosted instance behind HTTPS but marks the session cookie `secure`
      # here: browsers make an exception for localhost, none for a LAN IP, so
      # the cookie never comes back and the login fails with 419 Page Expired.
      SESSION_SECURE_COOKIE: "false"
      VITE_DEV_HOST: ${DEV_HOST:-localhost}
      VITE_DEV_CLIENT_PORT: ${DEV_VITE_PORT:-5273}
      LARAVEL_BYPASS_ENV_CHECK: "1"
      PNPM_HOME: /root/.local/share/pnpm
      CI: "true"
    # The working copy is mounted at /app, so the script does not need to be
    # baked into the dev image — and editing it does not need a rebuild.
    command: ["sh", "/app/docker/dev-entrypoint.sh"]

volumes:
  scalable-cli:

