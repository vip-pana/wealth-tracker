# Production compose: a machine that runs the app 24/7 (a box at home behind
# Tailscale, or a VPS). Deliberately separate from docker-compose.yml — that one
# mounts the source tree, runs Vite and a log tailer, and assumes a developer is
# watching. Nothing here mounts source: the image carries built assets.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The Scalable CLI binary is selected by architecture at build time, so building
# on the target machine covers both x86 and ARM without extra flags.
services:
  # A Tailscale node dedicated to this app: it joins the tailnet under its own
  # hostname and gets its own certificate, so the address becomes
  # https://wealth-tracker.<tailnet>.ts.net rather than a port on the host.
  #
  # That HTTPS is what removed the need for a throwaway cloudflared tunnel
  # during the Enable Banking consent flow — see docs/self-hosting.md.
  #
  # `app` runs inside this network stack (network_mode: service:tailscale): to
  # the rest of the tailnet the two containers are one node, and serve reaches
  # the app on 127.0.0.1:8000 without it being exposed anywhere else.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: wealth-tracker
    restart: unless-stopped
    environment:
      # A tailnet auth key (Settings → Keys on the admin console). Reusable and
      # preferably ephemeral-free, since the node is long-lived.
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY missing from .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      # The node identity. Without it every recreation would register a fresh
      # node and the name would drift to wealth-tracker-1, wealth-tracker-2, …
      # — which silently breaks APP_URL and the registered bank redirect.
      - tailscale-state:/var/lib/tailscale
      - ./docker/tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    build:
      context: .
      target: prod
      args:
        # Stamps the running image with its commit so `updates:check` can tell
        # whether the deployed code is behind the remote. Defaults to "unknown"
        # when unset, which disables the check rather than reporting nonsense.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    # The queue worker and scheduler live inside the container (see
    # docker/prod-entrypoint.sh); restarting keeps them alive across reboots and
    # crashes, which is the whole point of a machine that is always on.
    restart: unless-stopped
    # No `ports`: the app has no network stack of its own, it shares the
    # sidecar's. That one publishes :443 over the tailnet through serve, so the
    # app is not reachable on the host at all.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
    volumes:
      # The database and the backup staging directory. Both must exist on the
      # host first — the entrypoint refuses to start on a missing database
      # rather than inventing an empty one.
      - ${WEALTH_TRACKER_DATA_DIR:-~/wealth-tracker-data}:/app/storage/app
      - ${WEALTH_TRACKER_BACKUP_DIR:-~/wealth-tracker-backups}:/app/backups
      # Scalable CLI login session + signing key — survives container recreation,
      # so `sc login` is not needed after every deploy.
      - scalable-cli:/root/.config/scalable-cli
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/app/database.sqlite
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: "30"
      # Must match the address you actually open. On Tailscale that is the
      # machine's tailnet name; a wrong value breaks absolute URLs and the
      # bank-consent redirect.
      APP_URL: ${APP_URL:-http://localhost:8080}
      LARAVEL_BYPASS_ENV_CHECK: "1"
    healthcheck:
      # Laravel's /up endpoint (configured in bootstrap/app.php). Marks the
      # container unhealthy if the web server dies while the container lives.
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  scalable-cli:
  # The Tailscale node identity — must survive container recreation.
  tailscale-state:
