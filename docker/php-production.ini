; PHP settings for the production image. The official PHP images ship no
; php.ini at all, so without this the app would run on the compiled-in
; defaults — which include displaying errors to the browser.

; A stack trace rendered into the page of a finance app is a disclosure, not a
; debugging aid. Errors go to the container log, where the operator can read
; them and a visitor cannot.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; No need to announce the PHP version in a response header.
expose_php = Off

; The code in the image never changes while the container runs, so opcache can
; skip the stat() on every include. A deploy replaces the container, which is
; what picks up new code.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; CSV import is the only route that takes a file, and the limits are there to
; keep a single request from exhausting the container.
upload_max_filesize = 16M
post_max_size = 16M
memory_limit = 256M
