name: Deploy to host

# Reusable: joins the tailnet as a throwaway node and asks the target machine to
# deploy a version of an app. Kept separate from the image build so the same job
# serves every app on the box — which one is an input, and the wrapper on the
# host resolves it to a checkout.
#
# The runner cannot do anything on the target beyond this: the tailnet ACL lets
# tag:ci reach the host on port 22 only, and the ssh account's login shell is a
# wrapper that accepts one command with two validated arguments. A stolen secret
# buys the ability to deploy an existing release, not a shell.
on:
  workflow_call:
    inputs:
      app:
        description: 'Application to deploy, as named in the host wrapper whitelist'
        required: true
        type: string
      version:
        description: 'Release version to deploy, without the leading v'
        required: true
        type: string
      host:
        description: 'Tailnet hostname of the target machine'
        required: true
        type: string
      ssh_user:
        description: 'Unix account to connect as (its login shell is the deploy wrapper)'
        required: false
        default: deploy
        type: string
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.app }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    # One deploy at a time per app: two overlapping runs would fight over .env
    # and the container. Keyed by app as well as host, so deploying this app
    # never queues behind another one on the same box. Not cancel-in-progress —
    # interrupting a deploy halfway is worse than queueing behind it.
    concurrency:
      group: deploy-${{ inputs.host }}-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # Must match a tag in the tailnet policy: the ACL grants tag:ci
          # port 22 on tag:prod and nothing else.
          tags: tag:ci
          # The node is created for this job and expires with it, so a run
          # never leaves a lingering device with tailnet access.
          use-cache: 'false'

      # The action above reports success even after several failed attempts to
      # come up, so a green step is not proof the node joined. Without this the
      # failure would surface as an opaque ssh timeout below.
      - name: Verify the node joined
        run: |
          tailscale status --json > /dev/null \
            || { echo "::error::not on the tailnet — check the OAuth client scopes (Auth Keys → Write) and tag:ci ownership"; exit 1; }

      - name: Deploy
        # Tailscale SSH authenticates against the tailnet identity, so there is
        # no ssh key to store or host key to pin: the wrapper checks the host key
        # against the one the coordination server advertises. It takes no ssh
        # options of its own — passing -o fails with "flag provided but not
        # defined".
        run: |
          tailscale ssh \
            "${{ inputs.ssh_user }}@${{ inputs.host }}" \
            "deploy ${{ inputs.app }} ${{ inputs.version }}"
