name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Keeps a rolling "release" PR up to date from conventional commits on main.
      # Merging that PR bumps the version, updates CHANGELOG.md, and tags the release.
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT (not the default GITHUB_TOKEN) so the release PR is authored by a
          # real user. PRs opened by github-actions[bot] are held as action_required
          # under the repo's Actions approval policy, blocking their CI every time.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
